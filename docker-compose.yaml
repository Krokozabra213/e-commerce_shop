services:
  # ==========================================
  # ИНФРАСТРУКТУРА: БАЗЫ ДАННЫХ POSTGRESQL
  # ==========================================
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  order-postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  user-postgres:
    image: postgres:16-alpine
    container_name: user-postgres
    restart: always
    ports:
      - "5435:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  # ==========================================
  # ИНФРАСТРУКТУРА: REDIS (Для Auth и API Gateway)
  # ==========================================
  redis:
    image: redis:8.6-alpine
    container_name: redis
    command: redis-server --requirepass redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  # ==========================================
  # ИНФРАСТРУКТУРА: MONGODB (Для Product Service)
  # ==========================================
  mongodb:
    image: mongo:7.0.5
    container_name: ecommerce-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: products
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\")' --authenticationDatabase admin -u admin -p admin123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["--auth", "--bind_ip_all"]
    networks:
      - ecommerce-network

  mongo-express:
    image: mongo-express:latest
    container_name: ecommerce-mongo-express
    restart: unless-stopped
    ports:
      - "8101:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ==========================================
  # ИНФРАСТРУКТУРА: KAFKA & SCHEMA REGISTRY
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: INFO
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/subjects" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: [
      "kafka-topics --create --if-not-exists --topic user.created --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic user.created.dlq --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic order.created --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic order.created.dlq --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic order.cancel-inventory --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic order.cancel-inventory.dlq --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic inventory.reserved --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic inventory.reserved.dlq --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic inventory.reservation-failed --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic inventory.reservation-failed.dlq --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic order.create-payment --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic payment.succeded --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3 && \
       kafka-topics --create --if-not-exists --topic payment.failed --bootstrap-server kafka:29092 --replication-factor 1 --partitions 3"
    ]
    restart: "no"
    networks:
      - ecommerce-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ==========================================
  # МИГРАЦИИ (GOOSE)
  # ==========================================
  auth-migrations:
    build:
      context: .
      dockerfile: services/auth-service/Migrate.Dockerfile
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=auth-postgres port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
      GOOSE_MIGRATION_DIR: /app/migrations
    networks:
      - ecommerce-network

  inventory-migrations:
    build:
      context: .
      dockerfile: services/inventory-service/Migrate.Dockerfile
    depends_on:
      inventory-postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=inventory-postgres port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
      GOOSE_MIGRATION_DIR: /app/migrations
    networks:
      - ecommerce-network

  order-migrations:
    build:
      context: .
      dockerfile: services/order-service/Migrate.Dockerfile
    depends_on:
      order-postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=order-postgres port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
      GOOSE_MIGRATION_DIR: /app/migrations
    networks:
      - ecommerce-network

  user-migrations:
    build:
      context: .
      dockerfile: services/user-service/Migrate.Dockerfile
    depends_on:
      user-postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=user-postgres port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
      GOOSE_MIGRATION_DIR: /app/migrations
    networks:
      - ecommerce-network

    # ==========================================
    # ТЕЛЕМЕТРИЯ
    # ==========================================

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.149.0
    command: [ "--config=/etc/otel-collector.yaml" ]
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # внутренние метрики коллектора
    restart: unless-stopped
    networks:
      - ecommerce-network

  tempo:
    container_name: tempo
    image: grafana/tempo:2.7.2
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP API + Grafana datasource
      - "9095:9095"   # gRPC (опционально)
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  loki:
    container_name: loki
    image: grafana/loki:3.5.0
    command: [ "-config.file=/etc/loki/loki.yaml" ]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  grafana:
    container_name: grafana
    image: grafana/grafana:11.6.0
    depends_on:
      - tempo
      - loki
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_LEVEL=warn
      - GF_FEATURE_TOGGLES_ENABLE=traceQLStreaming
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - ecommerce-network

  # ==========================================
  # МИКРОСЕРВИСЫ
  # ==========================================
  auth-service:
    container_name: auth-service
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: always
    ports:
      - "8100:8100"
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    env_file:
      - ./services/auth-service/.env
    environment:
      POSTGRES_HOST: auth-postgres
      TELEMETRY_ENABLED: true
      TELEMETRY_LOGS: true
      TELEMETRY_METRICS: false
      TELEMETRY_TRACES: true
      TELEMETRY_ENDPOINT: otel-collector:4317
      TELEMETRY_INSECURE: true
      TELEMETRY_SERVICE_NAME: auth-service
      TELEMETRY_SERVICE_VERSION: V1.0.0
      TELEMETRY_ENVIRONMENT: development
      TELEMETRY_TRACES_SAMPLE_RATE: 1.0
      TELEMETRY_LOG_TO_STDOUT: true
      TELEMETRY_SAMPLE_LOGS: false
    volumes:
      # Приватный ключ подписи JWT монтируется с хоста: в образ он не копируется
      # (см. .dockerignore). Путь внутри контейнера задан в
      # AUTH_JWT_PRIVATE_KEY_PATH (./certs/jwt-private.pem при WORKDIR /app).
      - ./services/auth-service/certs:/app/certs:ro
    networks:
      - ecommerce-network

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    restart: always
    ports:
      - "8200:8200"
    depends_on:
      user-postgres:
        condition: service_healthy
      user-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    env_file:
      - ./services/user-service/.env
    environment:
      POSTGRES_HOST: user-postgres
      TELEMETRY_ENABLED: true
      TELEMETRY_LOGS: true
      TELEMETRY_METRICS: false
      TELEMETRY_TRACES: true
      TELEMETRY_ENDPOINT: otel-collector:4317
      TELEMETRY_INSECURE: true
      TELEMETRY_SERVICE_NAME: user-service
      TELEMETRY_SERVICE_VERSION: V1.0.0
      TELEMETRY_ENVIRONMENT: development
      TELEMETRY_TRACES_SAMPLE_RATE: 1.0
      TELEMETRY_LOG_TO_STDOUT: true
      TELEMETRY_SAMPLE_LOGS: false
    networks:
      - ecommerce-network

  product-service:
    container_name: product-service
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    restart: always
    ports:
      - "8300:8300"
      - "44400:44400"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./services/product-service/.env
    environment:
      TELEMETRY_ENABLED: true
      TELEMETRY_LOGS: true
      TELEMETRY_METRICS: false
      TELEMETRY_TRACES: true
      TELEMETRY_ENDPOINT: otel-collector:4317
      TELEMETRY_INSECURE: true
      TELEMETRY_SERVICE_NAME: product-service
      TELEMETRY_SERVICE_VERSION: V1.0.0
      TELEMETRY_ENVIRONMENT: development
      TELEMETRY_TRACES_SAMPLE_RATE: 1.0
      TELEMETRY_LOG_TO_STDOUT: true
      TELEMETRY_SAMPLE_LOGS: false
    networks:
      - ecommerce-network

  inventory-service:
    container_name: inventory-service
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    restart: always
    ports:
      - "8400:8400"
      - "44100:44100"
    depends_on:
      inventory-postgres:
        condition: service_healthy
      inventory-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    env_file:
      - ./services/inventory-service/.env
    environment:
      POSTGRES_HOST: inventory-postgres
      TELEMETRY_ENABLED: true
      TELEMETRY_LOGS: true
      TELEMETRY_METRICS: false
      TELEMETRY_TRACES: true
      TELEMETRY_ENDPOINT: otel-collector:4317
      TELEMETRY_INSECURE: true
      TELEMETRY_SERVICE_NAME: inventory-service
      TELEMETRY_SERVICE_VERSION: V1.0.0
      TELEMETRY_ENVIRONMENT: development
      TELEMETRY_TRACES_SAMPLE_RATE: 1.0
      TELEMETRY_LOG_TO_STDOUT: true
      TELEMETRY_SAMPLE_LOGS: false
    networks:
      - ecommerce-network

  order-service:
    container_name: order-service
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    restart: always
    ports:
      - "8600:8600"
    depends_on:
      order-postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    env_file:
      - ./services/order-service/.env
    environment:
      POSTGRES_HOST: order-postgres
      TELEMETRY_ENABLED: true
      TELEMETRY_LOGS: true
      TELEMETRY_METRICS: false
      TELEMETRY_TRACES: true
      TELEMETRY_ENDPOINT: otel-collector:4317
      TELEMETRY_INSECURE: true
      TELEMETRY_SERVICE_NAME: order-service
      TELEMETRY_SERVICE_VERSION: V1.0.0
      TELEMETRY_ENVIRONMENT: development
      TELEMETRY_TRACES_SAMPLE_RATE: 1.0
      TELEMETRY_LOG_TO_STDOUT: true
      TELEMETRY_SAMPLE_LOGS: false
    networks:
      - ecommerce-network

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
    env_file:
      - ./services/api-gateway/.env
    environment:
      TELEMETRY_ENABLED: true
      TELEMETRY_LOGS: true
      TELEMETRY_METRICS: false
      TELEMETRY_TRACES: true
      TELEMETRY_ENDPOINT: otel-collector:4317
      TELEMETRY_INSECURE: true
      TELEMETRY_SERVICE_NAME: api-gateway
      TELEMETRY_SERVICE_VERSION: V1.0.0
      TELEMETRY_ENVIRONMENT: development
      TELEMETRY_TRACES_SAMPLE_RATE: 1.0
      TELEMETRY_LOG_TO_STDOUT: true
      TELEMETRY_SAMPLE_LOGS: false
    networks:
      - ecommerce-network

volumes:
  auth_postgres_data:
  inventory_postgres_data:
  order_postgres_data:
  user_postgres_data:
  redis_data:
  mongodb_data:
  tempo-data:
  loki-data:
  grafana-data:

networks:
  ecommerce-network:
    driver: bridge