name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on all modules
        run: |
          set -e
          for dir in $(go list -m -f '{{.Dir}}'); do
            if [ -z "$(find "$dir" -name '*.go' -print -quit)" ]; then
              echo "=== Skipping $dir (no .go files) ==="
              continue
            fi
            echo "=== Scanning $dir ==="
            (cd "$dir" && govulncheck ./...)
          done

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  image-scan:
    name: "Образы: сборка, non-root, Trivy"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Образы собираются локально, без push: сначала проверки, потом релиз.
      - name: Собрать образы
        env:
          PROJECT: ecommerce-shop
          CACHE_FROM: type=gha
          CACHE_TO: type=gha,mode=max
        run: deploy/helm/scripts/build-images.sh

      # Регрессия «образ снова собрался от root» проверяется по конфигу образа:
      # у distroless нет shell, поэтому `id` внутри контейнера не выполнить.
      - name: Проверить, что образы не работают от root
        run: |
          set -euo pipefail
          while read -r image; do
            [ -n "${image}" ] || continue
            user="$(docker image inspect --format '{{.Config.User}}' "${image}")"
            echo "${image} -> USER=${user:-<пусто = root>}"
            case "${user}" in
              65534*|nobody*) ;;
              *)
                echo "::error::${image} собран без непривилегированного USER (получено '${user}')"
                exit 1
                ;;
            esac
          done < <(PROJECT=ecommerce-shop deploy/helm/scripts/build-images.sh --print-tags)

      - name: Установить Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.75.0
          cache: true

      # Сканируются именно образы: job `trivy` выше идёт с scan-type=fs и CVE
      # базового слоя (а также финальный USER) не видит.
      - name: Сканировать образы (Trivy)
        run: |
          set -euo pipefail
          while read -r image; do
            [ -n "${image}" ] || continue
            echo "=== ${image} ==="
            trivy image \
              --scanners vuln \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              "${image}"
          done < <(PROJECT=ecommerce-shop deploy/helm/scripts/build-images.sh --print-tags)

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LOG_OPTS: "--all"

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint all modules
        run: make lint

      - name: Check formatting
        run: make fmt-check

  unit-test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'
      - name: Run unit tests with race detector
        run: make test-race

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'
      - name: Run integration tests
        run: make test-integration
      - name: Dump testcontainers logs on failure
        if: failure()
        run: docker ps -a --filter "label=org.testcontainers=true" || true

  codegen:
    name: Codegen check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

      - name: Regenerate protos
        working-directory: api
        run: |
          buf lint
          buf generate

      - name: Regenerate OpenAPI code
        working-directory: services/product-service
        run: make generate

      - name: Check generated code is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date."
            echo ""
            echo "Run locally:"
            echo "  cd api && make proto-gen"
            echo "  cd services/product-service && make generate"
            echo ""
            echo "Then commit the changes."
            echo ""
            echo "Files changed:"
            git diff --stat
            exit 1
          fi
          echo "✅ Generated code is up to date."

