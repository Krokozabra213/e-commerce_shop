name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck on all modules
        run: |
          set -e
          for dir in $(go list -m -f '{{.Dir}}'); do
            if [ -z "$(find "$dir" -name '*.go' -print -quit)" ]; then
              echo "=== Skipping $dir (no .go files) ==="
              continue
            fi
            echo "=== Scanning $dir ==="
            (cd "$dir" && govulncheck ./...)
          done

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LOG_OPTS: "--all"

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint all modules
        run: make lint

      - name: Check formatting
        run: make fmt-check

  unit-test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'
      - name: Run unit tests with race detector
        run: make test-race

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'
      - name: Run integration tests
        run: make test-integration
      - name: Dump testcontainers logs on failure
        if: failure()
        run: docker ps -a --filter "label=org.testcontainers=true" || true

  codegen:
    name: Codegen check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: '**/go.sum'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.50.0'

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

      - name: Regenerate protos
        working-directory: api
        run: |
          buf lint
          buf generate

      - name: Regenerate OpenAPI code
        working-directory: services/product-service
        run: make generate

      - name: Check generated code is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date."
            echo ""
            echo "Run locally:"
            echo "  cd api && make proto-gen"
            echo "  cd services/product-service && make generate"
            echo ""
            echo "Then commit the changes."
            echo ""
            echo "Files changed:"
            git diff --stat
            exit 1
          fi
          echo "✅ Generated code is up to date."

