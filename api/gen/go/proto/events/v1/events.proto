syntax = "proto3";

package events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Krokozabra213/e-commerce_shop/api/gen/go/proto/events/v1;eventsv1";

message UserCreated {
  User user = 1;
  google.protobuf.Timestamp event_time = 2;
}

message User {
  string id = 1;
  string email = 2;
  repeated string roles = 3;
  google.protobuf.Timestamp created_at = 4;
}

message OrderCreatedEvent {
  EventMetadata metadata = 1;
  OrderData order = 2;
}

message OrderCancelledEvent {
  EventMetadata metadata = 1;
  OrderCancellationData cancellation = 2;
}

message EventMetadata {
  string event_id = 1;
  string event_type = 2;
  google.protobuf.Timestamp timestamp = 3;
  string correlation_id = 4;
}

message OrderData {
  string id = 1;
  repeated ProductItem items = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ProductItem {
  string product_id = 1;
  int32 quantity = 2;
}

message OrderCancellationData {
  string order_id = 1;
  string reason = 2;
  google.protobuf.Timestamp cancelled_at = 3;
}

message InventoryReservedEvent {
  EventMetadata metadata = 1;
  ReservationData reservation = 2;
}

message InventoryReservationFailedEvent {
  EventMetadata metadata = 1;
  ReservationFailureData failure = 2;
}

message ReservationData {
  string order_id = 1;
  google.protobuf.Timestamp reserved_at = 3;
}

message ReservationFailureData {
  string order_id = 1;
  ReservationFailureReason reason = 2;
  string details = 3;
  google.protobuf.Timestamp failed_at = 4;
}

enum ReservationFailureReason {
  RESERVATION_FAILURE_REASON_UNSPECIFIED = 0;
  RESERVATION_FAILURE_REASON_INSUFFICIENT_STOCK = 1;
  RESERVATION_FAILURE_REASON_PRODUCT_NOT_FOUND = 2;
  RESERVATION_FAILURE_REASON_INTERNAL_ERROR = 3;
}