app:
  name: "inventory-service"

postgres:
  host: "postgres"
  port: "5432"
  user: "postgres"
  dbName: "postgres"
  password: "postgres"

http:
  host: "0.0.0.0"
  port: "8400"

  allowedOrigins:
    - "http://localhost:3000"

slog:
  level: "debug"
  format: "text"
  add_source: true

grpc:
  host: "0.0.0.0"
  port: "44100"

orderCreatedConsumer:
  brokers:
    - "kafka:29092"
  groupID: "inventory-service"
  topic: "order.created"
  dlqTopic: "order.created.dlq"

orderCancelledConsumer:
  brokers:
    - "kafka:29092"
  groupID: "inventory-service"
  topic: "order.cancelled"
  dlqTopic: "order.cancelled.dlq"

kafka_producer:
  brokers: ["kafka:29092"]