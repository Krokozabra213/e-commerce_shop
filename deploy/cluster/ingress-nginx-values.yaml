# =============================================================================
# ingress-nginx: values для удалённого сервера (k3s / любой кластер)
# =============================================================================
# Установка:
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm repo update
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     --namespace ingress-nginx --create-namespace \
#     -f deploy/cluster/ingress-nginx-values.yaml \
#     --wait --timeout 10m
#
# ВАЖНО для k3s: там по умолчанию стоит Traefik, который уже занимает 80/443.
# Либо ставьте k3s сразу без него:
#     curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
# либо освободите порты позже:
#     kubectl -n kube-system scale deploy traefik --replicas=0
#     kubectl -n kube-system delete svc traefik   # если есть
# Иначе ingress-nginx не получит внешний адрес, а чарт ждёт ingressClassName: nginx.
# =============================================================================

controller:
  # k3s: встроенный ServiceLB (Klipper) выдаёт LoadBalancer с IP узла.
  # Для голого kubeadm без LB — поставьте type: NodePort и откройте 30080/30443,
  # либо hostNetwork: true (тогда контроллер слушает 80/443 напрямую).
  service:
    type: LoadBalancer

  config:
    # === ТРЕБОВАНИЕ ТЗ: только TLS 1.3 ===
    # ingress-nginx не умеет задавать протоколы пер-ингресс аннотацией, это
    # настройка контроллера. TLS 1.2 и ниже отключаются полностью.
    ssl-protocols: "TLSv1.3"

    # ВНИМАНИЕ: ssl-ciphers в nginx действует только на TLS <= 1.2.
    # Наборы шифров TLS 1.3 задаются OpenSSL и по умолчанию безопасны
    # (TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256,
    #  TLS_AES_128_GCM_SHA256) — трогать их не нужно.
    ssl-ciphers: ""

    # HSTS: браузер запоминает, что домен только по https. Включайте ТОЛЬКО
    # когда сертификат настоящий (Let's Encrypt) — иначе получите «залипший»
    # http-домен в браузере.
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    hsts-preload: "false"

    # За прокси/балансировщиком облака
    use-forwarded-headers: "true"
    proxy-body-size: "8m"

  # Реплик контроллера: 2+ имеет смысл при нескольких узлах.
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  metrics:
    enabled: true

defaultBackend:
  enabled: false
