# =============================================================================
# ingress-nginx: values для удалённого сервера (k3s / любой кластер)
# =============================================================================

controller:
  # k3s: встроенный ServiceLB (Klipper) выдаёт LoadBalancer с IP узла.
  service:
    type: LoadBalancer

  config:
    # Только TLS 1.3 (настройка контроллера, не Ingress).
    ssl-protocols: "TLSv1.3"

    # ssl-ciphers в nginx действует только на TLS <= 1.2.
    ssl-ciphers: ""

    # HSTS: браузер запоминает, что домен только по https.
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    hsts-preload: "false"

    # use-forwarded-headers=true заставляет nginx определять адрес клиента из
    # заголовка X-Forwarded-For (real_ip_header XFF, set_real_ip_from 0.0.0.0/0),
    # а затем проставлять его в X-Real-IP. Тогда X-Real-IP подделывается клиентом
    # и лимит обходится. Перед ingress нет L7-балансировщика (k3d/k3s ServiceLB —
    # это L4), поэтому выключаем: X-Real-IP = реальный TCP-адрес клиента.
    # Если появится внешний L7-балансировщик, включите обратно вместе с
    # proxy-real-ip-cidr = его подсети, а не 0.0.0.0/0.
    use-forwarded-headers: "false"
    proxy-body-size: "8m"

  # Реплик контроллера: 2+ имеет смысл при нескольких узлах.
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  metrics:
    enabled: true

defaultBackend:
  enabled: false
