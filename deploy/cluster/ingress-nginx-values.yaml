# =============================================================================
# ingress-nginx: values для удалённого сервера (k3s / любой кластер)
# =============================================================================

controller:
  # k3s: встроенный ServiceLB (Klipper) выдаёт LoadBalancer с IP узла.
  service:
    type: LoadBalancer

  config:
    # Только TLS 1.3 (настройка контроллера, не Ingress).
    ssl-protocols: "TLSv1.3"

    # ssl-ciphers в nginx действует только на TLS <= 1.2.
    ssl-ciphers: ""

    # HSTS: браузер запоминает, что домен только по https.
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    hsts-preload: "false"

    # За прокси/балансировщиком облака
    use-forwarded-headers: "true"
    proxy-body-size: "8m"

  # Реплик контроллера: 2+ имеет смысл при нескольких узлах.
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  metrics:
    enabled: true

defaultBackend:
  enabled: false
