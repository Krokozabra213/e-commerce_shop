# =============================================================================
# Дополнительный Ingress: хост localhost → api-gateway (для локальных тестов)
# =============================================================================
# Отдельный http-Ingress на localhost, не затрагивающий основной https-Ingress.
# =============================================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-localhost
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-shop
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: ecommerce-shop
  annotations:
    # localhost обслуживаем по http: так требует Google для локальной отладки.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
---
# host в Ingress обязан быть DNS-именем, а не IP-адресом.
