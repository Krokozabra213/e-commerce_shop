# =============================================================================
# ecommerce-infra — профиль для реального кластера
# PostgreSQL/Redis/MongoDB/Kafka запускаются одиночными StatefulSet'ами без HA,
# бэкапов, PITR и автомасштабирования.
# =============================================================================

global:
  # Реестр образов.
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent

postgresql:
  enabled: true
  auth:
    username: postgres
    password: ""
    existingSecret: "postgresql-credentials"
    secretName: "postgresql-credentials"
  persistence:
    enabled: true
    size: 20Gi
    # StorageClass с поддержкой расширения (например, gp3, premium-rwo).
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  extraConfig:
    max_connections: "200"
    shared_buffers: "1GB"
  # Разносим инстансы БД по разным узлам.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: infra

redis:
  enabled: true
  auth:
    enabled: true
    password: ""
    existingSecret: "redis-credentials"
    secretName: "redis-credentials"
    passwordKey: "password"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  config:
    appendonly: true
    maxmemory: "1gb"
    maxmemoryPolicy: "noeviction"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

mongodb:
  enabled: true
  auth:
    enabled: true
    rootUsername: admin
    rootPassword: ""
    database: products
    existingSecret: "mongodb-credentials"
    secretName: "mongodb-credentials"
  persistence:
    enabled: true
    size: 30Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

kafka:
  enabled: true
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # Одиночный брокер: Kafka недоступна при рестарте пода.
  topics:
    enabled: true
    partitions: 6
    replicationFactor: 1

schemaRegistry:
  enabled: true
  replicas: 2
  compatibilityLevel: "backward"
  logLevel: "WARN"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # Разносим реплики Schema Registry по узлам.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: schema-registry
