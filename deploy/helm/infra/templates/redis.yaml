{{- if .Values.redis.enabled }}
{{- $redis := .Values.redis }}
{{- $component := "redis" }}
{{- /* Secret с паролем Redis */ -}}
{{- if and $redis.auth.enabled (not $redis.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $redis.auth.secretName }}
  labels:
    {{- include "infra.componentLabels" (dict "root" $ "component" $component "role" "cache") | nindent 4 }}
type: Opaque
data:
  {{ $redis.auth.passwordKey }}: {{ $redis.auth.password | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $redis.serviceName }}
  labels:
    {{- include "infra.componentLabels" (dict "root" $ "component" $component "role" "cache") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ $redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "infra.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
---
# Headless Service — управляющий для StatefulSet (см. postgresql.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ $redis.serviceName }}-headless
  labels:
    {{- include "infra.componentLabels" (dict "root" $ "component" $component "role" "cache") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: redis
      port: {{ $redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "infra.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $redis.serviceName }}
  labels:
    {{- include "infra.componentLabels" (dict "root" $ "component" $component "role" "cache") | nindent 4 }}
spec:
  serviceName: {{ $redis.serviceName }}-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "infra.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infra.componentLabels" (dict "root" $ "component" $component "role" "cache") | nindent 8 }}
        {{- with $redis.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        ecommerce.io/config-hash: {{ (printf "%v|%v|%v" $redis.config $redis.service.port $redis.auth.enabled) | sha256sum | trunc 16 | quote }}
        {{- with $redis.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "infra.imagePullSecrets" $ | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml $redis.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "infra.image" (dict "root" $ "image" $redis.image) }}
          imagePullPolicy: {{ include "infra.imagePullPolicy" $ }}
          # Kubernetes сам подставляет $(REDIS_PASSWORD) в args — оболочка не нужна.
          args:
            {{- if $redis.auth.enabled }}
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            {{- end }}
            {{- if $redis.config.appendonly }}
            - "--appendonly"
            - "yes"
            {{- end }}
            {{- if $redis.config.maxmemory }}
            - "--maxmemory"
            - {{ $redis.config.maxmemory | quote }}
            - "--maxmemory-policy"
            - {{ $redis.config.maxmemoryPolicy | quote }}
            {{- end }}
            {{- range $redis.config.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            {{- if $redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if $redis.auth.existingSecret }}{{ $redis.auth.existingSecret }}{{ else }}{{ $redis.auth.secretName }}{{ end }}
                  key: {{ $redis.auth.passwordKey }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                {{- if $redis.auth.enabled }}
                - 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG'
                {{- else }}
                - 'redis-cli ping | grep -q PONG'
                {{- end }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                {{- if $redis.auth.enabled }}
                - 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG'
                {{- else }}
                - 'redis-cli ping | grep -q PONG'
                {{- end }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                {{- if $redis.auth.enabled }}
                - 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG'
                {{- else }}
                - 'redis-cli ping | grep -q PONG'
                {{- end }}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          {{- include "infra.resources" $redis.resources | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not $redis.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      {{- with $redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "infra.componentLabels" (dict "root" $ "component" $component "role" "cache") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $redis.persistence.accessModes | nindent 10 }}
        {{- if $redis.persistence.storageClass }}
        storageClassName: {{ $redis.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $redis.persistence.size | quote }}
  {{- end }}
{{- end }}
