{{- $c := .Values.grafana -}}
{{- if $c.enabled -}}
{{- $component := "grafana" -}}
{{- $name := include "observability.componentName" (dict "root" . "component" $component) -}}
{{- $labels := include "observability.componentLabels" (dict "root" . "component" $component) -}}
{{- $selector := include "observability.selectorLabels" (dict "root" . "component" $component) -}}
{{- $saName := include "observability.serviceAccountName" (dict "root" . "component" $component) -}}
{{- $adminSecretName := $c.existingSecret | default (printf "%s-admin" $name) -}}
{{- $adminSecretKey := $c.existingSecretKey | default "admin-password" -}}
{{- if $c.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if not $c.existingSecret }}
{{- $anonymous := $c.anonymous | default dict }}
{{- if and (not $anonymous.enabled) (not $c.adminPassword) }}
{{- fail (printf "\n\ngrafana.adminPassword не задан, а grafana.anonymous.enabled=false.\nЗадайте одно из:\n  --set grafana.adminPassword=<пароль>\n  --set grafana.existingSecret=<имя Secret> --set grafana.existingSecretKey=<ключ>\n") }}
{{- end }}
{{- $adminPassword := $c.adminPassword | default (randAlphaNum 24) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSecretName }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
data:
  {{ $adminSecretKey }}: {{ $adminPassword | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-datasources
  labels:
    {{- $labels | nindent 4 }}
data:
  datasources.yaml: |
    {{- $c.datasources | nindent 4 }}
---
# Headless Service — управляющий (governing) для StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "observability.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "observability.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  serviceName: {{ $name }}-headless
  replicas: {{ $c.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selector | nindent 8 }}
      annotations:
        checksum/datasources: {{ include "observability.configChecksum" (dict "root" . "component" $component "config" $c.datasources) }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $saName }}
      automountServiceAccountToken: false
      {{- include "observability.imagePullSecrets" (dict "root" . "component" $component) | nindent 6 }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      containers:
        - name: grafana
          image: {{ include "observability.image" (dict "root" . "component" $component) | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.service.httpPort }}
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ $c.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecretName }}
                  key: {{ $adminSecretKey }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ $c.anonymous.enabled | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: {{ $c.anonymous.orgRole | default "Admin" | quote }}
            {{- if $c.anonymous.enabled }}
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            {{- end }}
            - name: GF_USERS_DEFAULT_THEME
              value: {{ $c.defaultTheme | quote }}
            - name: GF_LOG_LEVEL
              value: {{ $c.logLevel | quote }}
            {{- if $c.featureToggles }}
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: {{ join "," $c.featureToggles | quote }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $c.securityContext | nindent 12 }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: {{ $name }}-datasources
        {{- if not $c.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $c.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- $labels | nindent 10 }}
        {{- with $c.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ $c.persistence.accessMode | default "ReadWriteOnce" }}
        {{- if $c.persistence.storageClass }}
        storageClassName: {{ $c.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $c.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- $selector | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.httpPort }}
      targetPort: http
      protocol: TCP
{{- $ingress := $c.ingress | default dict }}
{{- if $ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $ingress.host | quote }}
      secretName: {{ $ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $ingress.host | quote }}
      http:
        paths:
          - path: {{ $ingress.path | default "/" }}
            pathType: {{ $ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $c.service.httpPort }}
{{- end }}
{{- end }}
