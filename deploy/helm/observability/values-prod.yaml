# =============================================================================
# values-prod.yaml — production-like overrides
# Персистентное хранилище увеличенного размера, больше ресурсов, анонимный
# доступ Grafana выключен, ingress включён, длительный retention метрик.
# =============================================================================

otel-collector:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

tempo:
  persistence:
    enabled: true
    # Пусто = storageClass по умолчанию.
    storageClass: ""
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

loki:
  persistence:
    enabled: true
    storageClass: ""
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

prometheus:
  persistence:
    enabled: true
    storageClass: ""
    size: 100Gi
  retention: 30d
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

grafana:
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  # Пароль из заранее созданного Secret.
  existingSecret: grafana-admin
  existingSecretKey: admin-password
  anonymous:
    enabled: false
    orgRole: Viewer
  logLevel: warn
  ingress:
    enabled: true
    className: nginx
    host: grafana.example.com
    path: /
    pathType: Prefix
    tls:
      enabled: true
      secretName: grafana-tls
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
