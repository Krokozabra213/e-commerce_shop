# =============================================================================
# values-prod.yaml — production-like overrides
# -----------------------------------------------------------------------------
# Что переопределяем относительно values.yaml:
#   * включённое персистентное хранилище с увеличенными размерами
#   * больше ресурсов
#   * Grafana: анонимный доступ ВЫКЛЮЧЕН, пароль только через existingSecret
#   * Grafana ingress включён (замените host/tls на свои)
#   * более длительный retention метрик и трейсов
# Использование:
#   helm upgrade --install obs deploy/helm/observability -n observability \
#     -f values-prod.yaml
#
# ПЕРЕД ДЕПЛОЕМ:
#   1. Создайте Secret с паролем Grafana:
#      kubectl -n observability create secret generic grafana-admin \
#        --from-literal=admin-password="$(openssl rand -base64 24)"
#   2. Проверьте storageClass (пусто = cluster default) и ingress.host.
# =============================================================================

# Общий namespace для стека наблюдаемости задаётся при установке:
#   -n observability --create-namespace
# (в самом чарте namespace не хардкодится)

otel-collector:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

tempo:
  persistence:
    enabled: true
    # Пусто = storageClass по умолчанию; укажите свою (например, fast-ssd).
    storageClass: ""
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

loki:
  persistence:
    enabled: true
    storageClass: ""
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

prometheus:
  persistence:
    enabled: true
    storageClass: ""
    size: 100Gi
  retention: 30d
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

grafana:
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  # В prod пароль берём из заранее созданного Secret, а не из values.
  existingSecret: grafana-admin
  existingSecretKey: admin-password
  anonymous:
    enabled: false
    orgRole: Viewer
  logLevel: warn
  ingress:
    enabled: true
    className: nginx
    host: grafana.example.com
    path: /
    pathType: Prefix
    tls:
      enabled: true
      secretName: grafana-tls
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
