# =============================================================================
# values-dev.yaml — локальная разработка
# persistence выключен (emptyDir), пониженные ресурсы, анонимный доступ Grafana,
# короткий retention метрик.
# =============================================================================

tempo:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  persistence:
    enabled: false
  # Короткое хранение метрик.
  retention: 6h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  persistence:
    enabled: false
  # Фиксированный пароль только для локальной разработки.
  adminPassword: admin
  anonymous:
    enabled: true
    orgRole: Admin
  logLevel: debug
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  ingress:
    enabled: false

otel-collector:
  # Пониженные лимиты ресурсов.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
