# =============================================================================
# product-service — конфигурация
# =============================================================================
# MongoDBConfig.URI имеет тег yaml:"-": URI задаётся только переменной окружения MONGO_URI (из Secret'а).
# =============================================================================

app:
  name: "product-service"
  version: "v1.0.0"

mongo:
  database: {{ .Values.dependencies.mongodb.database | quote }}
  appName: "product-service"
  maxPoolSize: 100
  minPoolSize: 10
  maxConnIdleTime: 30m
  connectTimeout: 10s
  socketTimeout: 30s
  serverTimeout: 30s
  retry_writes: true
  compressors:
    - snappy
    - zstd

http:
  host: "0.0.0.0"
  port: {{ .svc.http.port | quote }}
  readTimeout: 10s
  writeTimeout: 10s
  maxHeaderBytes: 1
  bodyLimitBytes: 4
  allowedOrigins:
{{ include "ecommerce-shop.allowedOrigins" (dict "root" . "svc" .svc) }}

grpc:
  host: "0.0.0.0"
  port: {{ .svc.grpc.port | quote }}
  readTimeout: 10s
  writeTimeout: 10s
  maxHeaderBytes: 1

slog:
  level: {{ .Values.logging.level | quote }}
  format: {{ .Values.logging.format | quote }}
  add_source: {{ .Values.logging.addSource }}

{{ include "ecommerce-shop.telemetryBlock" (dict "root" . "name" "product-service") }}
