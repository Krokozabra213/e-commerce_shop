global:
  imageRegistry: "ghcr.io"
  imagePullSecrets:
    - name: ghcr-pull
  imagePullPolicy: IfNotPresent
  environment: "prod"
  waitTimeoutSeconds: 300
  commonLabels:
    app.kubernetes.io/environment: prod

logging:
  level: "info"
  format: "json"
  addSource: false

observability:
  enabled: true
  otel:
    endpoint: "otel-collector:4317"
    insecure: true
  logs: true
  metrics: true
  traces: true
  tracesSampleRate: 0.1
  logToStdout: true
  sampleLogs: false

secrets:
  create: false
  existingSecret: "ecommerce-shop-secrets"

dependencies:
  postgres:
    auth:
      host: "auth-db.internal.example.com"
      port: "5432"
      username: "ecommerce_auth"
      database: "auth"
      sslMode: "require"
    inventory:
      host: "inventory-db.internal.example.com"
      port: "5432"
      username: "ecommerce_inventory"
      database: "inventory"
      sslMode: "require"
    order:
      host: "order-db.internal.example.com"
      port: "5432"
      username: "ecommerce_order"
      database: "order"
      sslMode: "require"
    user:
      host: "user-db.internal.example.com"
      port: "5432"
      username: "ecommerce_user"
      database: "user"
      sslMode: "require"

  redis:
    host: "redis.internal.example.com"
    port: "6379"
    database: 0

  mongodb:
    host: "mongo.internal.example.com"
    port: "27017"
    username: "ecommerce"
    database: "products"

  kafka:
    brokers: "kafka-0.internal.example.com:9092,kafka-1.internal.example.com:9092,kafka-2.internal.example.com:9092"

  schemaRegistry:
    url: "https://schema-registry.internal.example.com"

  services:
    api-gateway:
      host: "api-gateway"
      port: "4000"
    auth-service:
      host: "auth-service"
      port: "8100"
    user-service:
      host: "user-service"
      port: "8200"
    product-service:
      host: "product-service"
      port: "8300"
      grpcPort: "44400"
    inventory-service:
      host: "inventory-service"
      port: "8400"
      grpcPort: "44100"
    order-service:
      host: "order-service"
      port: "8600"

auth:
  jwt:
    accessTTL: 15m
    refreshTTL: 720h
  oauth:
    google:
      enabled: true
    github:
      enabled: true

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

defaults:
  spreadAcrossNodes: true

networkPolicy:
  enabled: true
  defaultDenyIngress: true

migrations:
  enabled: true
  hook: "pre-install,pre-upgrade"
  backoffLimit: 2
  activeDeadlineSeconds: 1800

services:
  api-gateway:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 65
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
    pdb:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    ingress:
      enabled: true
      host: "api.example.com"
      tls:
        enabled: true
        secretName: "api-example-com-tls"

  auth-service:
    replicaCount: 3
    pdb:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  user-service:
    replicaCount: 3
    pdb:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  product-service:
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 15
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi

  inventory-service:
    replicaCount: 3
    pdb:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  order-service:
    replicaCount: 3
    pdb:
      enabled: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
