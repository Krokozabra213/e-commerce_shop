# =============================================================================
# ecommerce-shop — values по умолчанию
# =============================================================================
# Service каждого сервиса называется так же, как ключ в `services`, без префикса
# релиза: конфиги ссылаются друг на друга короткими DNS-именами; один релиз на namespace.
# Конфигурация сервисов лежит в `files/configs/<имя-сервиса>.yaml` и рендерится в ConfigMap.
# Переменные окружения из Secret'а переопределяют секретные поля.
# =============================================================================

nameOverride: ""
fullnameOverride: ""

global:
  # Только хост реестра (ghcr.io, registry.example.com); путь/проект входит в
  # image.repository, итоговый образ: <imageRegistry>/<image.repository>:<tag>. Пусто = Docker Hub.
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  # Тег для всех сервисов и образов миграций сразу. Пусто = .Chart.AppVersion.
  # Отдельный сервис переопределяется через services.<name>.image.tag.
  imageTag: ""
  # Образ для init-контейнеров ожидания зависимостей: полная ссылка на образ,
  # global.imageRegistry к ней не применяется.
  waitImage: "busybox:1.36"

  # Значение переменных ENV и APP_ENV; определяет имя файла конфига `configs/<environment>.yaml`.
  environment: "dev"

  # Сколько секунд init-контейнеры ждут зависимости (TCP/HTTP).
  waitTimeoutSeconds: 600

  commonLabels: {}
  commonAnnotations: {}

# -----------------------------------------------------------------------------
# Адреса зависимостей: совпадают с infra-чартом (../infra) или указывают на внешние managed-сервисы в prod.
# -----------------------------------------------------------------------------
dependencies:
  postgres:
    auth:
      host: "auth-postgres"
      port: "5432"
      username: "postgres"
      database: "postgres"
      sslMode: "disable"
    inventory:
      host: "inventory-postgres"
      port: "5432"
      username: "postgres"
      database: "postgres"
      sslMode: "disable"
    order:
      host: "order-postgres"
      port: "5432"
      username: "postgres"
      database: "postgres"
      sslMode: "disable"
    user:
      host: "user-postgres"
      port: "5432"
      username: "postgres"
      database: "postgres"
      sslMode: "disable"

  redis:
    host: "redis"
    port: "6379"
    database: 0

  mongodb:
    host: "mongodb"
    port: "27017"
    username: "admin"
    database: "products"
    # Пусто = URI собирается как mongodb://<username>:<password>@<host>:<port>
    uri: ""
    # Параметры URI, добавляемые при сборке (например "?replicaSet=rs0&authSource=admin").
    uriParams: ""

  kafka:
    # Список брокеров через запятую (env-separator в KafkaConfig — ",").
    brokers: "kafka:29092"

  schemaRegistry:
    url: "http://schema-registry:8081"

  # Адреса сервисов друг для друга (используются в files/configs/*.yaml).
  services:
    api-gateway:
      host: "api-gateway"
      port: "4000"
    auth-service:
      host: "auth-service"
      port: "8100"
    user-service:
      host: "user-service"
      port: "8200"
    product-service:
      host: "product-service"
      port: "8300"
      grpcPort: "44400"
    inventory-service:
      host: "inventory-service"
      port: "8400"
      grpcPort: "44100"
    order-service:
      host: "order-service"
      port: "8600"

# -----------------------------------------------------------------------------
# Настройки телеметрии, попадающие в configs/*.yaml (секция telemetry).
# -----------------------------------------------------------------------------
observability:
  # Если false — telemetry.enabled=false во всех конфигах.
  enabled: false
  otel:
    endpoint: "otel-collector:4317"
    insecure: true
  logs: true
  metrics: false
  traces: true
  tracesSampleRate: 1.0
  logToStdout: true
  sampleLogs: false

# -----------------------------------------------------------------------------
# Секреты. Значения ниже используются только при secrets.create=true.
#
# Ожидаемые ключи в Secret'е (одинаковые для create=true и для существующего):
#   app-secret
#   postgres-auth-password, postgres-user-password,
#   postgres-inventory-password, postgres-order-password
#   redis-password
#   mongodb-uri
#   jwt-private-key
#   oauth-google-client-id, oauth-google-client-secret, oauth-google-redirect-url
#   oauth-github-client-id, oauth-github-client-secret, oauth-github-redirect-url
# -----------------------------------------------------------------------------
secrets:
  create: true
  # Разрешить secrets.create=true при global.environment=prod/production; по умолчанию
  # запрещено, иначе пароли и приватный ключ JWT попали бы в values и Helm release.
  allowCreateInProduction: false
  # Имя создаваемого Secret'а (пусто = "<fullname>-secrets").
  name: ""
  # Имя существующего Secret'а; используется при create=false.
  existingSecret: ""

  values:
    appSecret: "change-me-in-production"

    postgres:
      # Пароль каждой БД. Значения должны совпадать с infra-чартом.
      auth: "postgres"
      user: "postgres"
      inventory: "postgres"
      order: "postgres"

    redis: "redis"

    # Пароль root-пользователя MongoDB (нужен для сборки MONGO_URI).
    # Должен совпадать с infra.mongodb.auth.rootPassword.
    mongodbPassword: "admin123"

    # Приватный RSA-ключ подписи JWT (PEM, многострочный); пустое значение
    # приводит к ошибке helm install.
    jwtPrivateKey: ""

    oauth:
      # Поля clientID/clientSecret/redirectURL помечены env-required и валидируются
      # всегда, поэтому при выключенном OAuth значения остаются заглушкой "disabled".
      google:
        clientId: "disabled"
        clientSecret: "disabled"
        redirectUrl: "http://localhost/oauth/google/callback/disabled"
      github:
        clientId: "disabled"
        clientSecret: "disabled"
        redirectUrl: "http://localhost/oauth/github/callback/disabled"

# -----------------------------------------------------------------------------
# Настройки auth-service (секции auth_jwt / oauth / email_verification).
# -----------------------------------------------------------------------------
auth:
  jwt:
    issuer: "auth-service"
    algorithm: "RS256"
    keyID: "auth-key-v1"
    # Путь внутри контейнера. Файл монтируется из Secret'а (ключ jwt-private-key).
    privateKeyPath: "/etc/ecommerce/certs/jwt-private.pem"
    accessTTL: 15m
    refreshTTL: 720h
    rotation:
      enabled: false
  oauth:
    # clientID/clientSecret/redirectURL всегда приходят из Secret'а
    # (поля помечены env-required и валидируются даже при enabled=false).
    google:
      enabled: false
    github:
      enabled: false
  emailVerification:
    ttl: 15m
    tokenLength: 32

# -----------------------------------------------------------------------------
# Логирование (секция slog в configs/*.yaml).
# -----------------------------------------------------------------------------
logging:
  level: "info"
  format: "json"
  addSource: false

# -----------------------------------------------------------------------------
# Rate limiter api-gateway (секция rate_limiter). Поля capacity/rate/window не имеют
# env-тегов и настраиваются только через yaml.
# -----------------------------------------------------------------------------
rateLimiter:
  enabled: true
  authenticated:
    capacity: 60
    rate: 2.0
    window: 1m
  anonymous:
    capacity: 20
    rate: 0.5
    window: 1m
  failOpen: true
  keyPrefix: "ratelimit"

# -----------------------------------------------------------------------------
# Kafka: потребители и продюсеры. Значения одинаковы для всех сервисов
# (переносятся в configs/*.yaml), отличаются только groupID/topic.
# -----------------------------------------------------------------------------
kafkaConsumer:
  sessionTimeout: 30s
  heartbeatInterval: 10s
  maxPollInterval: 5m
  startOffsetEarliest: true

kafkaProducer:
  dialTimeout: 5s
  writeTimeout: 10s
  maxRetries: 5
  retryBackoff: 300ms

# -----------------------------------------------------------------------------
# Outbox-паттерн. Применяется ко всем outbox-секциям конфигов.
# -----------------------------------------------------------------------------
outbox:
  batchSize: 100
  pollInterval: 1s
  maxAttempts: 10
  errorBackoff: 2s
  dbTimeout: 5s
  sendTimeout: 5s
  lease: 1m

# -----------------------------------------------------------------------------
# Значения по умолчанию для всех сервисов. Применяются, если у сервиса
# соответствующий ключ НЕ задан (проверка через hasKey — булевы false работают).
# -----------------------------------------------------------------------------
defaults:
  # CORS. Для локальной разработки фронтенд обычно на localhost:3000.
  allowedOrigins:
    - "http://localhost:3000"

  # Мягко распределять реплики сервиса по разным узлам (topologySpreadConstraints
  # по kubernetes.io/hostname, ScheduleAnyway); переопределяется через
  # services.<name>.topologySpreadConstraints.
  spreadAcrossNodes: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    # Требуется для Pod Security Standard "restricted": без seccompProfile
    # поды не пройдут admission в таком namespace.
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  terminationGracePeriodSeconds: 30

  probes:
    startup:
      enabled: true
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# -----------------------------------------------------------------------------
# Миграции goose.
# hook="post-install,pre-upgrade": Job миграций читает пароль из Secret'а чарта,
# а Secret и ConfigMap должны существовать до его запуска.
# -----------------------------------------------------------------------------
migrations:
  enabled: true
  hook: "post-install,pre-upgrade"
  hookWeight: "-5"
  hookDeletePolicy: "before-hook-creation"
  backoffLimit: 3
  activeDeadlineSeconds: 900
  # 0 = не удалять завершённый Job по TTL; предыдущий Job удаляется политикой
  # before-hook-creation при следующем релизе.
  ttlSecondsAfterFinished: 0
  # Сколько ждать доступности БД в init-контейнере.
  waitTimeoutSeconds: 600

# -----------------------------------------------------------------------------
# Ingress.
# ingress.enabled — мастер-выключатель: Ingress создаётся, только если он включён
# и у сервиса svc.ingress.enabled=true. Наружу публикуется только api-gateway;
# прямой доступ к внутренним сервисам включается через svc.ingress.enabled.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  tls: []
  #  - secretName: ecommerce-tls
  #    hosts:
  #      - api.ecommerce.local

# -----------------------------------------------------------------------------
# NetworkPolicy. По умолчанию выключено: при неверных правилах или CNI без поддержки
# policy весь namespace перестанет общаться.
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # Запретить весь входящий трафик в namespace по умолчанию и разрешать только
  # перечисленные потоки; требует CNI с поддержкой NetworkPolicy.
  defaultDenyIngress: true
  # Метки подов инфраструктуры (infra-чарт).
  infrastructurePodLabels:
    app.kubernetes.io/part-of: ecommerce-infra
  # Метки подов observability-стека (observability-чарт).
  observabilityPodLabels:
    app.kubernetes.io/name: observability
  # Дополнительные селекторы подов, которым разрешён вход во все сервисы
  # (например, поды другого namespace'а через namespaceSelector).
  extraIngressRules: []
  #  - from:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: monitoring
  #    ports:
  #      - port: 4000
  #        protocol: TCP

# -----------------------------------------------------------------------------
# Сервисы
# -----------------------------------------------------------------------------
services:

  api-gateway:
    enabled: true
    replicaCount: 2
    image:
      repository: "krokozabra213/api-gateway"
      tag: ""            # пусто = .Chart.AppVersion
    http:
      port: 4000
    grpc: null
    secrets:
      redisPassword: true
    # Зависимости, без которых api-gateway не стартует.
    waitFor:
      - name: redis
        host: "redis"
        port: 6379
      - name: auth-service
        host: "auth-service"
        port: 8100
        path: "/readyz"
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    ingress:
      enabled: true
      host: "api.ecommerce.local"
      path: "/"
      pathType: "Prefix"
      annotations: {}
      tls:
        enabled: false
        secretName: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []

  auth-service:
    enabled: true
    replicaCount: 1
    image:
      repository: "krokozabra213/auth-service"
      tag: ""
    http:
      port: 8100
    grpc: null
    secrets:
      redisPassword: true
      oauth: true
      jwtPrivateKey: true
    waitFor:
      - name: postgres
        host: "auth-postgres"
        port: 5432
      - name: redis
        host: "redis"
        port: 6379
      - name: kafka
        host: "kafka"
        port: 29092
      - name: schema-registry
        host: "schema-registry"
        port: 8081
    # Какая БД из dependencies.postgres используется сервисом
    # (определяет ключ пароля в Secret'е: postgres-<database>-password).
    database: "auth"
    migration:
      enabled: true
      image:
        repository: "krokozabra213/auth-service-migrate"
        tag: ""
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: false
      minAvailable: 1
    ingress:
      enabled: false
      host: "auth.ecommerce.local"
      path: "/"
      pathType: "Prefix"
      annotations: {}
      tls:
        enabled: false
        secretName: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []

  user-service:
    enabled: true
    replicaCount: 1
    image:
      repository: "krokozabra213/user-service"
      tag: ""
    http:
      port: 8200
    grpc: null
    secrets: {}
    waitFor:
