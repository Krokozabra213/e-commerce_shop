# =============================================================================
# ecommerce-shop — один удалённый сервер: HTTPS + 3 реплики + инфра в кластере
# =============================================================================
# Профиль для варианта «всё на одной машине» (k3s + infra-чарт в том же кластере);
# адреса зависимостей остаются короткими DNS-именами из values.yaml
# (auth-postgres, redis, mongodb, kafka, schema-registry).
# =============================================================================

global:
  imageRegistry: "ghcr.io"
  imagePullSecrets:
    - name: ghcr-pull
  # ENV/APP_ENV: ключ ConfigMap'а и имя файла configs/<env>.yaml.
  environment: "prod"
  waitTimeoutSeconds: 300

# Адреса зависимостей не переопределяются: используются короткие имена из values.yaml,
# так как infra-чарт стоит в этом же namespace.

logging:
  level: "info"
  format: "json"
  addSource: false

# true, если дополнительно ставите observability-чарт в тот же namespace
observability:
  enabled: false

# В prod Secret создаётся заранее скриптом и не управляется Helm.
secrets:
  create: false
  existingSecret: "ecommerce-shop-secrets"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # cert-manager выпустит сертификат сам по этой аннотации
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
  tls:
    - secretName: api-example-com-tls
      hosts:
        - api.example.com # домен

defaults:
  # Мягко распределять реплики по узлам; ScheduleAnyway не блокирует планирование
  # и на одноузловом сервере.
  spreadAcrossNodes: true

# На k3s стандартный CNI (flannel) не поддерживает NetworkPolicy, поэтому включение ничего не даст.
networkPolicy:
  enabled: false

migrations:
  enabled: true
  # Secret уже создан заранее, поэтому миграции можно выполнять ДО выката подов.
  hook: "pre-install,pre-upgrade"
  backoffLimit: 2
  activeDeadlineSeconds: 1800

auth:
  oauth:
    # Флаги косметические (код их не читает); реальные client_id/secret/redirect
    # берутся из Secret'а.
    google:
      enabled: true
    github:
      enabled: true

services:

  api-gateway:
    replicaCount: 3
    autoscaling:
      enabled: false
    pdb:
      enabled: true
      maxUnavailable: 1
    ingress:
      enabled: true
      host: "api.example.com" # домен
      path: "/"
      pathType: "Prefix"
      tls:
        enabled: false # TLS задан общим блоком ingress.tls выше

  auth-service:
    replicaCount: 3
    autoscaling:
      enabled: false
    pdb:
      enabled: true
      maxUnavailable: 1

  user-service:
    replicaCount: 3
    autoscaling:
      enabled: false
    pdb:
      enabled: true
      maxUnavailable: 1

  product-service:
    replicaCount: 3
    autoscaling:
      enabled: false
    pdb:
      enabled: true
      maxUnavailable: 1

  inventory-service:
    replicaCount: 3
    autoscaling:
      enabled: false
    pdb:
      enabled: true
      maxUnavailable: 1

  order-service:
    replicaCount: 3
    autoscaling:
      enabled: false
    pdb:
      enabled: true
      maxUnavailable: 1
