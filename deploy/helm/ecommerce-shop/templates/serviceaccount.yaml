{{- /*
Один ServiceAccount на релиз; доступ к Kubernetes API не нужен, token не монтируется, RBAC-правила не создаются.
*/ -}}
{{- if include "ecommerce-shop.anyServiceEnabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecommerce-shop.serviceAccountName" . }}
  labels:
    {{- include "ecommerce-shop.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
