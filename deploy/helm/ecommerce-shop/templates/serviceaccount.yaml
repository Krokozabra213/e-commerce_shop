{{- /*
Один ServiceAccount на релиз. Сервисам доступ к Kubernetes API не нужен,
поэтому token не монтируется (automountServiceAccountToken: false),
а RBAC-правила не создаются.
*/ -}}
{{- if include "ecommerce-shop.anyServiceEnabled" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecommerce-shop.serviceAccountName" . }}
  labels:
    {{- include "ecommerce-shop.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
