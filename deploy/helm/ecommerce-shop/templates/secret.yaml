{{- /*
Секреты приложения.
В prod НЕ используйте secrets.create=true: создайте Secret заранее и укажите
secrets.existingSecret (см. README).
*/ -}}
{{- if and .Values.secrets.create (include "ecommerce-shop.anyServiceEnabled" .) }}
{{- $s := .Values.secrets.values }}
{{- $mongo := .Values.dependencies.mongodb }}
{{- $auth := index .Values.services "auth-service" | default dict }}

{{- /* Fail-fast: без приватного ключа auth-service не стартует. */ -}}
{{- if and $auth.enabled (not (trim $s.jwtPrivateKey)) }}
{{- fail "\n\nsecrets.values.jwtPrivateKey пуст, а auth-service включён.\nПриватный ключ нужен auth-service для подписи JWT.\n\nВарианты:\n  1) передать файл:\n       --set-file secrets.values.jwtPrivateKey=services/auth-service/certs/jwt-private.pem\n  2) использовать заранее созданный Secret:\n       --set secrets.create=false --set secrets.existingSecret=<имя>\n\nПодсказка: deploy/helm/deploy.sh делает это автоматически (или `make -C deploy/helm install-app`).\n" }}
{{- end }}

{{- $mongoURI := $mongo.uri }}
{{- if not $mongoURI }}
{{- $mongoURI = printf "mongodb://%s:%s@%s:%s%s" $mongo.username $s.mongodbPassword $mongo.host $mongo.port $mongo.uriParams }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce-shop.secretName" . }}
  labels:
    {{- include "ecommerce-shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  app-secret: {{ $s.appSecret | b64enc | quote }}

  postgres-auth-password: {{ $s.postgres.auth | b64enc | quote }}
  postgres-user-password: {{ $s.postgres.user | b64enc | quote }}
  postgres-inventory-password: {{ $s.postgres.inventory | b64enc | quote }}
  postgres-order-password: {{ $s.postgres.order | b64enc | quote }}

  redis-password: {{ $s.redis | b64enc | quote }}

  mongodb-uri: {{ $mongoURI | b64enc | quote }}

  jwt-private-key: {{ $s.jwtPrivateKey | b64enc | quote }}

  oauth-google-client-id: {{ $s.oauth.google.clientId | b64enc | quote }}
  oauth-google-client-secret: {{ $s.oauth.google.clientSecret | b64enc | quote }}
  oauth-google-redirect-url: {{ $s.oauth.google.redirectUrl | b64enc | quote }}
  oauth-github-client-id: {{ $s.oauth.github.clientId | b64enc | quote }}
  oauth-github-client-secret: {{ $s.oauth.github.clientSecret | b64enc | quote }}
  oauth-github-redirect-url: {{ $s.oauth.github.redirectUrl | b64enc | quote }}
{{- end }}
