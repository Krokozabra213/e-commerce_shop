{{- /*
PodDisruptionBudget.

ВНИМАНИЕ: minAvailable, равный числу реплик, полностью блокирует
добровольное вытеснение (drain узла). Для replicaCount=1 имеет смысл
только maxUnavailable: 0 при наличии запаса, либо PDB не нужен.
*/ -}}
{{- $root := . }}
{{- range $name, $svc := $root.Values.services }}
{{- $pdb := $svc.pdb | default dict }}
{{- if and $svc.enabled $pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "ecommerce-shop.componentLabels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  {{- if hasKey $pdb "maxUnavailable" }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else if hasKey $pdb "minAvailable" }}
  {{- /* hasKey, а не default: minAvailable=0 — валидное значение,
         а sprig `default` считает 0 пустым и молча подменяет на 1. */}}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "ecommerce-shop.selectorLabels" (dict "root" $root "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
